server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Required by Flutter's multi-threaded skwasm renderer.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.mymangatheque.com https://appwrite.mymangatheque.com wss://appwrite.mymangatheque.com https://www.gstatic.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob: https:; manifest-src 'self'; upgrade-insecure-requests" always;

    # Flutter's main output filenames are stable between releases. Revalidate
    # them so a browser cannot keep running an older deployment.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/javascript;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # The Dart WASM support runtime is an ES module. Some Nginx versions do
    # not include the .mjs extension in their default MIME map.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Support go_router paths such as /auth/callback when loaded directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
