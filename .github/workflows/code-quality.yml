name: Code Quality

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: code-quality-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sonarqube:
        name: SonarQube
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
                  persist-credentials: false

            # The analysis requires to retrieve dependencies and build successfully
            - name: Install Flutter
              uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
              with:
                  channel: "stable"

            - name: Flutter pub get
              run: flutter pub get

            - name: Analyze
              run: flutter analyze

            - name: Run tests with coverage
              run: flutter test --coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: flutter-coverage-${{ github.run_id }}
                  path: coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

            - name: Add SonarQube config to ignore C/C++/ObjC
              run: |
                  echo "sonar.cpp.file.suffixes=-" >> sonar-project.properties
                  echo "sonar.objc.file.suffixes=-" >> sonar-project.properties
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
