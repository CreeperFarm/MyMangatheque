name: Production smoke checks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-checks
  cancel-in-progress: true

jobs:
  smoke:
    name: Validate the deployed Web application and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run production smoke checks
        env:
          WEB_BASE_URL: ${{ vars.PRODUCTION_WEB_BASE_URL || 'https://mymangatheque.com' }}
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.mymangatheque.com' }}
          EXPECTED_ORIGIN: ${{ vars.PRODUCTION_WEB_BASE_URL || 'https://mymangatheque.com' }}
        run: bash tool/production_smoke_check.sh
