name: Build AAB

on:
  push:
    branches: [ main,dev ]

permissions:
  contents: read

jobs:
  build-aab:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Flutter pub get
        run: flutter pub get

      - name: Create Keystore and Env file
        run: |
          openssl aes-256-cbc -d -in android/app/keystore.enc -out android/app/upload-keystore.jks -k "${{ secrets.KEYSTORE_DECRYPTION_PASSWORD }}" -pbkdf2
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > .env
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> .env
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> .env
          echo "storeFile=../upload-keystore.jks" >> .env
          ls -lh android/app/upload-keystore.jks

      - name: Build AAB
        run: flutter build appbundle --obfuscate --split-debug-info out/android --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/bundle/release/app-release.aab
