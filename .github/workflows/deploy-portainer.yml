name: Build and Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-web-deployment
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE || 'ghcr.io/creeperfarm/mymangatheque-web' }}

jobs:
  test:
    name: Test Flutter application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          if [[ -z "${version}" ]]; then
            echo "Unable to read the version from pubspec.yaml." >&2
            exit 1
          fi
          # A Flutter build number uses '+', which is not valid in a Docker tag.
          echo "version=${version//+/-}" >> "${GITHUB_OUTPUT}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redeploy Portainer service
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Portainer webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${PORTAINER_WEBHOOK_URL}" ]]; then
            echo "Missing PORTAINER_WEBHOOK_URL GitHub secret." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${PORTAINER_WEBHOOK_URL}" \
            --output /dev/null
          echo "Portainer redeployment requested for version ${{ needs.build.outputs.version }}."
